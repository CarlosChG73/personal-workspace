<article
  class="flex h-full flex-col rounded-lg border border-slate-200 bg-white p-6 transition-colors dark:border-slate-800 dark:bg-slate-900"
>
  <!-- Project information -->
  <h3 class="text-xl font-semibold text-slate-900 dark:text-white">
    {{ title() }}
  </h3>

  <p class="mt-3 flex-1 text-sm leading-6 text-slate-600 dark:text-slate-300">
    {{ description() }}
  </p>

  <p class="mt-4 text-sm font-medium text-slate-500 dark:text-slate-400">
    {{ technologies() }}
  </p>

  <!-- Repository availability -->
  <div class="mt-6">
    @if (repositoryUrl()) {
    <a
      i18n
      [href]="repositoryUrl()"
      target="_blank"
      rel="noopener noreferrer"
      class="text-sm font-semibold text-slate-900 underline-offset-4 hover:underline dark:text-white"
    >
      View source
    </a>
    } @else {
    <span
      i18n
      class="text-sm text-slate-500 dark:text-slate-400"
    >
        Repository pending
      </span>
    }
  </div>
</article>
