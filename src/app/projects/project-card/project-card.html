<article
  class="flex h-full flex-col rounded-lg border border-slate-200 bg-white p-6 transition-colors dark:border-slate-800 dark:bg-slate-900"
>
  <!-- Project information -->
  <h3 class="text-xl font-semibold text-slate-900 dark:text-white">
    {{ title() }}
  </h3>

  <p class="mt-3 flex-1 text-sm leading-6 text-slate-600 dark:text-slate-300">
    {{ description() }}
  </p>

  <p class="mt-4 text-sm font-medium text-slate-500 dark:text-slate-400">
    {{ technologies() }}
  </p>

  <!-- Public project links -->
  @if (repositoryUrl() || demoUrl()) {
  <div class="mt-6 flex flex-wrap gap-4">
    @if (repositoryUrl()) {
    <a
      i18n
      [href]="repositoryUrl()"
      target="_blank"
      rel="noopener noreferrer"
      class="text-sm font-semibold text-slate-900 underline-offset-4 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 focus-visible:ring-offset-2 dark:text-white dark:focus-visible:ring-white dark:focus-visible:ring-offset-slate-900"
    >
      View source
    </a>
    }

    @if (demoUrl()) {
    <a
      i18n
      [href]="demoUrl()"
      target="_blank"
      rel="noopener noreferrer"
      class="text-sm font-semibold text-slate-900 underline-offset-4 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 focus-visible:ring-offset-2 dark:text-white dark:focus-visible:ring-white dark:focus-visible:ring-offset-slate-900"
    >
      Live demo
    </a>
    }
  </div>
  }
</article>
