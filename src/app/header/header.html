<header
  class="sticky top-0 z-40 border-b border-slate-200 bg-white transition-colors dark:border-slate-800 dark:bg-slate-950"
>
  <div class="mx-auto w-full max-w-6xl px-4 py-4 sm:px-6 lg:px-8">

    <div class="flex items-center justify-between">
      <!-- Project identity -->
      <a
        href="#"
        class="text-lg font-semibold text-slate-900 transition-colors dark:text-white"
      >
        PersonalWorkspace
      </a>

      <div class="flex items-center gap-1 sm:gap-2">

        <!-- Desktop navigation -->
        <nav
          class="mr-2 hidden md:block"
          aria-label="Main navigation"
          i18n-aria-label
        >
          <ul
            class="flex items-center gap-6 text-sm font-medium text-slate-600 dark:text-slate-300"
          >
            <li>
              <a
                i18n
                href="#skills"
                class="transition-colors hover:text-slate-900 dark:hover:text-white"
              >
                Skills
              </a>
            </li>

            <li>
              <a
                i18n
                href="#projects"
                class="transition-colors hover:text-slate-900 dark:hover:text-white"
              >
                Projects
              </a>
            </li>

            <li>
              <a
                i18n
                href="#contact"
                class="transition-colors hover:text-slate-900 dark:hover:text-white"
              >
                Contact
              </a>
            </li>
          </ul>
        </nav>

        <!-- Language selector -->
        <a
          [href]="languageUrl"
          [attr.aria-label]="languageAriaLabel"
          class="inline-flex h-10 min-w-10 items-center justify-center rounded-md border border-slate-300 px-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 focus-visible:ring-offset-2 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800 dark:focus-visible:ring-slate-200 dark:focus-visible:ring-offset-slate-950"
        >
          {{ languageLabel }}
        </a>

        <!-- Theme toggle -->
        <button
          type="button"
          class="inline-flex h-10 w-10 items-center justify-center rounded-md border border-slate-300 text-slate-700 transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 focus-visible:ring-offset-2 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800 dark:focus-visible:ring-slate-200 dark:focus-visible:ring-offset-slate-950"
          [attr.aria-label]="themeAriaLabel"
          [attr.aria-pressed]="isDarkMode"
          (click)="toggleTheme()"
        >
          @if (isDarkMode) {
          <span aria-hidden="true" class="text-lg leading-none">☀</span>
          } @else {
          <span aria-hidden="true" class="text-lg leading-none">☾</span>
          }
        </button>

        <!-- Mobile navigation toggle -->
        <button
          type="button"
          class="inline-flex h-10 w-10 items-center justify-center rounded-md border border-slate-300 text-slate-700 transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 focus-visible:ring-offset-2 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800 dark:focus-visible:ring-slate-200 dark:focus-visible:ring-offset-slate-950 md:hidden"
          aria-label="Toggle navigation"
          i18n-aria-label
          aria-controls="mobile-navigation"
          [attr.aria-expanded]="isMenuOpen"
          (click)="toggleMenu()"
        >
          @if (isMenuOpen) {
          <span aria-hidden="true" class="text-xl leading-none">×</span>
          } @else {
          <span aria-hidden="true" class="text-xl leading-none">☰</span>
          }
        </button>

      </div>
    </div>

    <!-- Mobile navigation -->
    @if (isMenuOpen) {
    <nav
      id="mobile-navigation"
      class="mt-4 border-t border-slate-200 pt-4 dark:border-slate-800 md:hidden"
      aria-label="Mobile navigation"
      i18n-aria-label
    >
      <ul class="space-y-1 text-sm font-medium text-slate-700 dark:text-slate-300">
        <li>
          <a
            i18n
            href="#skills"
            class="block rounded-md px-3 py-2 transition hover:bg-slate-50 hover:text-slate-900 dark:hover:bg-slate-800 dark:hover:text-white"
            (click)="closeMenu()"
          >
            Skills
          </a>
        </li>

        <li>
          <a
            i18n
            href="#projects"
            class="block rounded-md px-3 py-2 transition hover:bg-slate-50 hover:text-slate-900 dark:hover:bg-slate-800 dark:hover:text-white"
            (click)="closeMenu()"
          >
            Projects
          </a>
        </li>

        <li>
          <a
            i18n
            href="#contact"
            class="block rounded-md px-3 py-2 transition hover:bg-slate-50 hover:text-slate-900 dark:hover:bg-slate-800 dark:hover:text-white"
            (click)="closeMenu()"
          >
            Contact
          </a>
        </li>
      </ul>
    </nav>
    }

  </div>
</header>
