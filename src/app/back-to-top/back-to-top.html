@if (isVisible) {
<button
  type="button"
  aria-label="Back to top"
  i18n-aria-label
  (click)="scrollToTop()"
  class="fixed bottom-3 right-3 z-50 inline-flex h-9 w-9 items-center justify-center rounded-full bg-slate-900 text-sm text-white shadow-lg transition hover:bg-slate-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 focus-visible:ring-offset-2 dark:bg-white dark:text-slate-950 dark:hover:bg-slate-200 dark:focus-visible:ring-white dark:focus-visible:ring-offset-slate-950 sm:bottom-6 sm:right-6 sm:h-11 sm:w-11 sm:text-base"
>
  ↑
</button>
}
